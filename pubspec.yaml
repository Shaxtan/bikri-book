name: bikri_book
description: "Bikri-Book — Apni dukan ka hisaab, ek click mein."
version: 2.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # Navigation
  go_router: ^14.2.0

  # i18n
  intl: ^0.20.2

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  uuid: ^4.4.0
  share_plus: ^9.0.0
  vibration: ^1.9.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0
  universal_html: ^2.2.4

  # Export
  pdf: ^3.11.0
  printing: ^5.13.0
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/